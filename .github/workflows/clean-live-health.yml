name: Verify Clean T-Score Live API

on:
  push:
    branches: [t-score-clean]
    paths:
      - '.github/workflows/clean-live-health.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live clean API health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 10 https://boostsmg.com/tscore-clean-api/health)"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo 'TSCORE_CLEAN_LIVE_HEALTH=verified'

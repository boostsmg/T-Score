name: Smoke Test Clean T-Score Backend

on:
  workflow_dispatch:
  push:
    branches:
      - t-score-clean
    paths:
      - 'clean-server/**'
      - '.github/workflows/clean-server-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r clean-server/requirements.txt

      - name: Start clean API
        run: |
          cd clean-server
          TSCORE_DB_PATH=/tmp/tscore-ci.db python -m uvicorn main:app --host 127.0.0.1 --port 8091 > /tmp/tscore-api.log 2>&1 &
          echo $! > /tmp/tscore-api.pid

      - name: Smoke test health signup login and core APIs
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8091/health >/tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json

          SIGNUP=$(curl -fsS -X POST http://127.0.0.1:8091/api/v1/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","email":"ci@example.com","full_name":"CI User","password":"StrongPass123"}')
          TOKEN=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["token"])' "$SIGNUP")

          curl -fsS http://127.0.0.1:8091/api/v1/me -H "Authorization: Bearer $TOKEN" | grep -q 'ci_user'
          curl -fsS http://127.0.0.1:8091/api/v1/people -H "Authorization: Bearer $TOKEN" | grep -q 'items'
          curl -fsS http://127.0.0.1:8091/api/v1/deals -H "Authorization: Bearer $TOKEN" | grep -q 'items'
          curl -fsS http://127.0.0.1:8091/api/v1/chats -H "Authorization: Bearer $TOKEN" | grep -q 'items'

          LOGIN=$(curl -fsS -X POST http://127.0.0.1:8091/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"login":"ci_user","password":"StrongPass123"}')
          echo "$LOGIN" | grep -q 'token'

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/tscore-api.log || true

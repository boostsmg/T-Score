name: Clean Android Signed-In E2E

on:
  workflow_dispatch:
  push:
    branches:
      - t-score-clean
    paths:
      - 'android/cleanapp/**'
      - 'clean-server/**'
      - '.github/scripts/clean-android-e2e.sh'
      - '.github/workflows/clean-android-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start clean backend and seed users
        shell: bash
        run: |
          set -euo pipefail
          pip install -r clean-server/requirements.txt
          rm -f /tmp/tscore-e2e.db
          cd clean-server
          TSCORE_DB_PATH=/tmp/tscore-e2e.db python -m uvicorn app:app --host 0.0.0.0 --port 8091 >/tmp/tscore-e2e-api.log 2>&1 &
          cd ..
          for i in {1..30}; do curl -fsS http://127.0.0.1:8091/health >/dev/null && break; sleep 1; done
          ALICE=$(curl -fsS -X POST http://127.0.0.1:8091/api/v1/auth/signup -H 'Content-Type: application/json' -d '{"username":"alice_e2e","email":"alice.e2e@example.com","full_name":"Alice E2E","password":"StrongPass123"}')
          curl -fsS -X POST http://127.0.0.1:8091/api/v1/auth/signup -H 'Content-Type: application/json' -d '{"username":"bob_e2e","email":"bob.e2e@example.com","full_name":"Bob CI","password":"StrongPass123"}' >/dev/null
          python -c 'import json,sys; print(json.loads(sys.argv[1])["token"])' "$ALICE" >/tmp/tscore-token

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build clean E2E APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :cleanapp:assembleDebug -PTSCORE_CLEAN_API_BASE=http://10.0.2.2:8091 --stacktrace

      - name: Run real signed-in tab flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x .github/scripts/clean-android-e2e.sh
            .github/scripts/clean-android-e2e.sh

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clean-e2e-failure-evidence
          path: |
            /tmp/clean-e2e-logcat.txt
            /tmp/window.xml
            /tmp/tscore-e2e-api.log
          if-no-files-found: ignore

name: Clean Android Signed-In E2E

on:
  workflow_dispatch:
  push:
    branches:
      - t-score-clean
    paths:
      - 'android/cleanapp/**'
      - '.github/scripts/clean-android-e2e.sh'
      - '.github/workflows/clean-android-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed signed-in users on live clean API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://boostsmg.com/tscore-clean-api/api/v1'
          curl -fsS --max-time 10 https://boostsmg.com/tscore-clean-api/health | grep -q '"ok":true'
          SUFFIX="${GITHUB_RUN_ID}"
          ALICE_USER="alice_e2e_${SUFFIX}"
          BOB_USER="bob_e2e_${SUFFIX}"
          ALICE=$(curl -fsS -X POST "$BASE/auth/signup" -H 'Content-Type: application/json' -d "{\"username\":\"$ALICE_USER\",\"email\":\"$ALICE_USER@example.com\",\"full_name\":\"Alice E2E\",\"password\":\"StrongPass123\"}")
          curl -fsS -X POST "$BASE/auth/signup" -H 'Content-Type: application/json' -d "{\"username\":\"$BOB_USER\",\"email\":\"$BOB_USER@example.com\",\"full_name\":\"Bob CI\",\"password\":\"StrongPass123\"}" >/dev/null
          python -c 'import json,sys; print(json.loads(sys.argv[1])["token"])' "$ALICE" >/tmp/tscore-token

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build clean E2E APK against production API
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :cleanapp:assembleDebug --stacktrace

      - name: Run real signed-in production tab flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x .github/scripts/clean-android-e2e.sh
            .github/scripts/clean-android-e2e.sh

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clean-e2e-failure-evidence
          path: |
            /tmp/clean-e2e-logcat.txt
            /tmp/window.xml
          if-no-files-found: ignore

name: Lean Runtime Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lean-runtime-hardening.yml'

permissions:
  contents: write

jobs:
  harden-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make LoginActivity non-blocking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/java/co/tinode/tindroid/LoginActivity.java')
          text = p.read_text()

          def rep(old, new):
              global text
              if old not in text:
                  raise SystemExit('Expected LoginActivity block not found: ' + old[:140])
              text = text.replace(old, new, 1)

          rep(
              'import android.widget.Toast;\n\n',
              'import android.widget.Toast;\n\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\n')

          rep(
              '    private static final String TAG = "LoginActivity";\n\n',
              '    private static final String TAG = "LoginActivity";\n    private static final ExecutorService LOGIN_STATE_EXECUTOR = Executors.newSingleThreadExecutor();\n\n')

          old = '''        boolean dbReady = false;\n        boolean credentialsRequired = false;\n        if (!recoveryMode) {\n            try {\n                BaseDb db = BaseDb.getInstance();\n                dbReady = db.isReady();\n                credentialsRequired = db.isCredValidationRequired();\n            } catch (Throwable t) {\n                Log.e(TAG, "Database state check failed; staying on safe login", t);\n            }\n        }\n\n        if (dbReady) {\n            Intent intent = new Intent(this, ChatsActivity.class);\n            intent.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TASK | Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);\n            startActivity(intent);\n            finish();\n            return;\n        }\n\n        try {\n            showFragment(credentialsRequired ? FRAGMENT_CREDENTIALS : FRAGMENT_LOGIN,\n                    null, false);\n        } catch (Throwable t) {\n'''
          new = '''        // Render immediately. SQLite open/migration must never hold the login UI or splash.\n        final boolean explicitCredentials = getIntent() != null\n                && getIntent().getBooleanExtra(EXTRA_CONFIRM_CREDENTIALS, false);\n        try {\n            showFragment(explicitCredentials ? FRAGMENT_CREDENTIALS : FRAGMENT_LOGIN, null, false);\n        } catch (Throwable t) {\n'''
          rep(old, new)

          old2 = '''        mAvatarVM = new ViewModelProvider(this).get(AvatarViewModel.class);\n\n        if (!TextUtils.isEmpty(crashReport)) {\n            showCrashReport(crashReport);\n        }\n'''
          new2 = '''        mAvatarVM = new ViewModelProvider(this).get(AvatarViewModel.class);\n\n        if (!recoveryMode && !explicitCredentials) {\n            probeStoredSessionInBackground();\n        }\n\n        if (!TextUtils.isEmpty(crashReport)) {\n            showCrashReport(crashReport);\n        }\n'''
          rep(old2, new2)

          marker = '''    private void showCrashReport(String report) {\n'''
          helper = '''    private void probeStoredSessionInBackground() {\n        LOGIN_STATE_EXECUTOR.execute(() -> {\n            boolean dbReady = false;\n            boolean credentialsRequired = false;\n            try {\n                BaseDb db = BaseDb.getInstance();\n                dbReady = db.isReady();\n                credentialsRequired = db.isCredValidationRequired();\n                if (dbReady) {\n                    // Pre-warm session objects away from the main thread.\n                    Cache.getTinode();\n                }\n            } catch (Throwable t) {\n                Log.e(TAG, "Background database/session probe failed", t);\n            }\n\n            final boolean ready = dbReady;\n            final boolean needCredentials = credentialsRequired;\n            runOnUiThread(() -> {\n                if (isFinishing() || isDestroyed()) {\n                    return;\n                }\n\n                // Do not interrupt the user if they already moved to signup/settings/reset.\n                Fragment current = getSupportFragmentManager().findFragmentById(R.id.contentFragment);\n                if (!(current instanceof LoginFragment)) {\n                    return;\n                }\n\n                if (ready) {\n                    Intent intent = new Intent(this, ChatsActivity.class);\n                    intent.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TASK\n                            | Intent.FLAG_ACTIVITY_NEW_TASK\n                            | Intent.FLAG_ACTIVITY_CLEAR_TOP);\n                    startActivity(intent);\n                    finish();\n                } else if (needCredentials) {\n                    showFragment(FRAGMENT_CREDENTIALS, null, false);\n                }\n            });\n        });\n    }\n\n'''
          if marker not in text:
              raise SystemExit('showCrashReport marker not found')
          text = text.replace(marker, helper + marker, 1)

          p.write_text(text)
          PY

          git diff --check
          git status --short
      - name: Commit login hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/co/tinode/tindroid/LoginActivity.java
          git commit -m "Keep login database probe off main thread"
          git push origin HEAD:main

name: Android Crash Audit

on:
  push:
    branches: [fix/android-repeated-close-20261102]
    paths:
      - 'android/**'
      - '.github/workflows/android-crash-audit.yml'

permissions:
  contents: read

jobs:
  crash-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PTSCORE_VERSION_CODE=1101 \
            -PTSCORE_VERSION_NAME=1.0.101
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime crash checks
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"

            check_fatal() {
              LOGFILE="$1"
              if grep -E 'FATAL EXCEPTION|Process: com\.tscore\.app.*has died|StackOverflowError' "$LOGFILE"; then
                echo 'Fatal Android crash detected'
                exit 1
              fi
            }

            adb logcat -c
            adb shell am force-stop com.tscore.app || true
            adb shell monkey -p com.tscore.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb logcat -d -v threadtime > launcher.log
            check_fatal launcher.log
            adb shell pidof com.tscore.app | grep -q .

            # Exercise logged-in shell directly. With no valid local session it must
            # recover to LoginActivity instead of killing the process.
            adb logcat -c
            adb shell am start -n com.tscore.app/co.tinode.tindroid.ChatsActivity || true
            sleep 8
            adb logcat -d -v threadtime > chats.log
            check_fatal chats.log
            adb shell pidof com.tscore.app | grep -q .
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|LoginActivity|ChatsActivity|com.tscore.app' | head -100 || true
      - name: Upload audit APK
        uses: actions/upload-artifact@v4
        with:
          name: T-Score-crash-audit-1.0.101
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

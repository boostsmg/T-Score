name: Build T-Score Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build T-Score debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "Building T-Score versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"
          ./gradlew --no-daemon assembleDebug \
            -PTSCORE_VERSION_CODE="${VERSION_CODE}" \
            -PTSCORE_VERSION_NAME="${VERSION_NAME}"
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/T-Score.apk
          sha256sum dist/T-Score.apk > dist/T-Score.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: T-Score-Android-APK
          path: dist/*
          retention-days: 30
      - name: Refresh direct test APK release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-latest"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/T-Score.apk \
              dist/T-Score.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Existing $TAG release not found; skipping test release asset refresh."
          fi

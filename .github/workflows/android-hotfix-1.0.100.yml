name: Build and Smoke Test T-Score v1.0.100

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-hotfix-1.0.100.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Static startup regression checks
        run: |
          set -euo pipefail
          grep -q 'bottomNav.getSelectedItemId() != itemId' android/app/src/main/java/co/tinode/tindroid/ChatsActivity.java
          grep -q 'void onViewCreated' android/app/src/main/java/co/tinode/tindroid/TrustProfileFragment.java
          grep -q 'userId = Cache.getTinode().getMyId()' android/app/src/main/java/co/tinode/tindroid/TrustProfileFragment.java
      - name: Build hotfix APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PTSCORE_VERSION_CODE=1100 \
            -PTSCORE_VERSION_NAME=1.0.100
      - name: Verify APK version
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          LINE="$($AAPT dump badging "$APK" | head -n1)"
          echo "$LINE" | grep -q "versionCode='1100'"
          echo "$LINE" | grep -q "versionName='1.0.100'"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test launcher and runtime
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.tscore.app || true
            adb shell monkey -p com.tscore.app -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.tscore.app | grep -q .
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|com.tscore.app|co.tinode.tindroid' | head -80 || true
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com\.tscore\.app|Caused by:|StackOverflowError|TScoreApp|InitRouterActivity|LoginActivity|ChatsActivity' | tail -400 || true
            adb logcat -c
            adb shell am start -n com.tscore.app/co.tinode.tindroid.ChatsActivity || true
            sleep 5
            adb shell pidof com.tscore.app | grep -q .
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com\.tscore\.app|Caused by:|StackOverflowError|ChatsActivity' | tail -400 || true
      - name: Collect verified hotfix APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/T-Score.apk
          sha256sum dist/T-Score.apk > dist/T-Score.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: T-Score-Hotfix-1.0.100
          path: dist/*
          retention-days: 30
      - name: Publish only after smoke test passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=test-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/T-Score.apk dist/T-Score.apk.sha256 --clobber
          else
            gh release create "$TAG" --title 'T-Score test-latest' --notes 'Verified T-Score hotfix v1.0.100.' dist/T-Score.apk dist/T-Score.apk.sha256
          fi

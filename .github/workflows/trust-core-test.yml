name: Test T-Score Trust Core

on:
  push:
    branches: [main]
    paths:
      - 'server/tscore/**'
      - 'server/tscoreapi/**'
      - 'server/cmd/tscore-trust-api/**'
      - '.github/workflows/trust-core-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test trust core and API
        run: go test ./tscore ./tscoreapi
      - name: Build trust API service
        run: go build ./cmd/tscore-trust-api

name: Test T-Score Trust Core

on:
  push:
    branches: [main]
    paths:
      - 'server/tscore/**'
      - 'server/tscoreapi/**'
      - 'server/cmd/tscore-trust-api/**'
      - '.github/workflows/trust-core-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test trust core and API
        run: go test ./tscore ./tscoreapi
      - name: Build production Linux trust API
        run: |
          mkdir -p ../dist-trust-api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist-trust-api/tscore-trust-api ./cmd/tscore-trust-api
          sha256sum ../dist-trust-api/tscore-trust-api > ../dist-trust-api/tscore-trust-api.sha256
      - name: Upload production binary
        uses: actions/upload-artifact@v4
        with:
          name: T-Score-Trust-API-Linux-amd64
          path: dist-trust-api/*
          retention-days: 30

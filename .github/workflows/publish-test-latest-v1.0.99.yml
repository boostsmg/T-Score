name: Publish T-Score v1.0.99 to test-latest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-test-latest-v1.0.99.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified final Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 41379691828 -n T-Score-Final-Android -D dist
          test -f dist/T-Score.apk
      - name: Verify version 1.0.99 / 1099
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          LINE="$($AAPT dump badging dist/T-Score.apk | head -n1)"
          echo "$LINE" | grep -q "versionCode='1099'"
          echo "$LINE" | grep -q "versionName='1.0.99'"
      - name: Create or update test-latest asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view test-latest >/dev/null 2>&1; then
            gh release upload test-latest dist/T-Score.apk --clobber
          else
            gh release create test-latest \
              --title "T-Score test-latest" \
              --notes "Production signing input for verified T-Score v1.0.99." \
              dist/T-Score.apk
          fi
          echo 'test-latest now contains T-Score v1.0.99'

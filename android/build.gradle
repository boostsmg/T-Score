// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'

        // For FCM push notifications
        classpath 'com.google.gms:google-services:4.4.4'

        // Crashlytics
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        // Legal compliance: plugin to collect and display OSS licenses.
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.10'
    }
}

ext {
    version_code = gitVersionCode()
    version_name = gitVersionName()
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com/' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

static def gitVersionCode() {
    def process = "git rev-list --count HEAD".execute()
    def value = process.text.trim()
    return value ? value.toInteger() : 1
}

static def gitVersionName() {
    def process = "git describe --tags --always".execute()
    def value = process.text.trim()
    if (!value) { return "0.1.0" }
    return value.startsWith("v") ? value.substring(1) : "0.1.0+" + value.take(8)
}

apply plugin: 'com.android.application'

// Final production gate: trusted BoostSMG API + updater-wired 2.0.0 source.
def cleanApiBase = project.findProperty('TSCORE_CLEAN_API_BASE') ?: 'https://boostsmg.com/tscore-clean-api'

android {
    namespace 'com.tscore.clean'
    compileSdkVersion 36

    defaultConfig {
        applicationId 'com.tscore.app'
        minSdkVersion 27
        targetSdkVersion 36
        versionCode 1200
        versionName '2.0.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + cleanApiBase + '"'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
}
